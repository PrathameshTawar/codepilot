<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cpGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="cpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Apple-Style Rounded Squircle Backdrop — Midnight Blue -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0B1020" stroke="rgba(34, 211, 238, 0.4)" stroke-width="1.5" />
  
  <!-- Subtle Matrix Circuit Lines -->
  <path d="M 14 32 L 24 32 L 30 20 L 36 44 L 42 32 L 50 32" stroke="rgba(34, 211, 238, 0.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Electric Blue / Cyan Lightning Code Core -->
  <path d="M 34 16 L 24 33 L 32 33 L 30 48 L 40 30 L 32 30 Z" fill="url(#cpGradient)" filter="url(#cpGlow)" />
  <circle cx="48" cy="18" r="2" fill="#22d3ee" />
  <circle cx="16" cy="46" r="2" fill="#34d399" />
</svg>
