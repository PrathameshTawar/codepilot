<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cpGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="cpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Apple-Style Rounded Squircle Backdrop -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#121118" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.5" />
  
  <!-- Subtle Matrix Circuit Lines -->
  <path d="M 14 32 L 24 32 L 30 20 L 36 44 L 42 32 L 50 32" stroke="rgba(192, 132, 252, 0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Lightning Code Core -->
  <path d="M 34 16 L 24 33 L 32 33 L 30 48 L 40 30 L 32 30 Z" fill="url(#cpGradient)" filter="url(#cpGlow)" />
  <circle cx="48" cy="18" r="2" fill="#c084fc" />
  <circle cx="16" cy="46" r="2" fill="#7c3aed" />
</svg>
